<script>
    // ============================================
    // GLOBAL FUNCTIONS - BISA DIPANGGIL DARI HTML
    // ============================================
    
    // LOGIN
    function handleLogin() {
        const pass = document.getElementById('loginPassword').value.trim();
        const loginStatus = document.getElementById('loginStatus');
        
        if (pass === 'UFO2020') {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loginStatus.style.display = 'none';
            
            // Panggil fungsi dari module
            if (window.loadProducts) window.loadProducts();
            if (window.loadSettings) window.loadSettings();
        } else {
            loginStatus.style.display = 'block';
            loginStatus.className = 'status-message error';
            loginStatus.textContent = '❌ Password salah!';
        }
    }

    function logout() {
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginStatus').style.display = 'none';
    }

    // TAB SWITCHER
    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-nav button').forEach(el => el.classList.remove('active'));
        
        const tabMap = {
            'produk': 'tabProduk',
            'tambah': 'tabTambah',
            'upload': 'tabUpload',
            'migrasi': 'tabMigrasi',
            'setting': 'tabSetting'
        };
        
        document.getElementById(tabMap[tab]).classList.add('active');
        
        // Cari tombol yang sesuai
        document.querySelectorAll('.tab-nav button').forEach(btn => {
            if (btn.textContent.includes(tab.charAt(0).toUpperCase() + tab.slice(1)) ||
                btn.textContent.includes('Produk') && tab === 'produk' ||
                btn.textContent.includes('Tambah') && tab === 'tambah' ||
                btn.textContent.includes('Upload') && tab === 'upload' ||
                btn.textContent.includes('Migrasi') && tab === 'migrasi' ||
                btn.textContent.includes('Setting') && tab === 'setting') {
                btn.classList.add('active');
            }
        });
    }

    // FILTER TABLE
    function filterTable() {
        const keyword = document.getElementById('searchProduct').value.toLowerCase();
        const rows = document.querySelectorAll('#productTableBody tr');
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(keyword) ? '' : 'none';
        });
    }

    // CLOSE EDIT MODAL
    function closeEditModal() {
        document.getElementById('editModal').classList.remove('show');
    }

    // DOWNLOAD TEMPLATE
    function downloadTemplate() {
        const headers = [
            'BRAND', 'TIPE', 'HARGA', 'KATEGORI', 'SUBKATEGORI',
            'SPEK1', 'SPEK2', 'SPEK3', 'SPEK4', 'SPEK5',
            'FOTO', 'STATUS', 'UNGGULAN', 'URUTAN', '', '', '', '', '', ''
        ];
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet([headers]);
        XLSX.utils.book_append_sheet(wb, ws, 'KATALOG');
        XLSX.writeFile(wb, 'Template_Katalog_UFO.xlsx');
    }

    // ============================================
    // DEKLARASI FUNGSI YANG AKAN DIISI OLEH MODULE
    // ============================================
    window.loadProducts = null;
    window.loadSettings = null;
    window.refreshProducts = null;
    window.tambahProduk = null;
    window.uploadExcel = null;
    window.migrasiGoogleSheets = null;
    window.saveSettings = null;
    window.editProduk = null;
    window.updateProduk = null;
    window.hapusProduk = null;
</script>

<!-- ============================================
SCRIPT - FIREBASE MODULE

<script type="module">
    // ============================================
    // FIREBASE IMPORTS
    // ============================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        getDocs, 
        doc, 
        setDoc, 
        deleteDoc, 
        query, 
        orderBy,
        addDoc,
        updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAzDlIWFWrpHyf2xgLYMifLcGmBqc10EW0",
        authDomain: "masterharga.firebaseapp.com",
        projectId: "masterharga",
        storageBucket: "masterharga.firebasestorage.app",
        messagingSenderId: "761584806568",
        appId: "1:761584806568:web:c6672e8fc0c695f15eb09d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const COLLECTIONS = {
        PRODUCTS: "ufo_products",
        SETTINGS: "ufo_settings",
        USERS: "ufo_users",
        PROMO: "ufo_promo"
    };

    // ============================================
    // GLOBAL STATE
    // ============================================
    let allProducts = [];

    // ============================================
    // LOAD PRODUCTS
    // ============================================
    async function loadProducts() {
        try {
            const q = query(collection(db, COLLECTIONS.PRODUCTS), orderBy('urutan', 'asc'));
            const snapshot = await getDocs(q);
            allProducts = [];
            snapshot.forEach(doc => {
                allProducts.push({ id: doc.id, ...doc.data() });
            });
            renderTable(allProducts);
            updateStats(allProducts);
        } catch (error) {
            console.error('Error loading products:', error);
            document.getElementById('productTableBody').innerHTML = `
                <tr><td colspan="8" style="text-align:center;padding:40px;color:#ffb4ab;">
                    ❌ Gagal memuat data: ${error.message}
                </td></tr>
            `;
        }
    }

    // ============================================
    // RENDER TABLE
    // ============================================
    function renderTable(products) {
        const tbody = document.getElementById('productTableBody');
        if (products.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#908fa0;">Belum ada produk.</td></tr>`;
            document.getElementById('productCount').textContent = 'Total: 0 produk';
            return;
        }

        let html = '';
        products.forEach((p, i) => {
            const statusBadge = p.status ? `<span class="badge-status ${p.status.toLowerCase()}">${p.status}</span>` : '-';
            const unggulanBadge = p.unggulan === 'YA' ? `<span class="badge-status unggulan">⭐ UNGGULAN</span>` : '-';
            const harga = p.harga ? `Rp ${Number(p.harga).toLocaleString('id-ID')}` : '-';
            
            html += `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${p.brand || ''}</strong></td>
                    <td>${p.tipe || ''}</td>
                    <td>${harga}</td>
                    <td>${p.kategori || ''}</td>
                    <td>${statusBadge}</td>
                    <td>${unggulanBadge}</td>
                    <td>
                        <button onclick="editProduk('${p.id}')" class="btn-primary" style="padding:4px 12px;font-size:11px;margin-right:4px;">✏️</button>
                        <button onclick="hapusProduk('${p.id}')" class="btn-danger" style="padding:4px 12px;font-size:11px;">🗑️</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        document.getElementById('productCount').textContent = `Total: ${products.length} produk`;
    }

    // ============================================
    // UPDATE STATS
    // ============================================
    function updateStats(products) {
        document.getElementById('statTotal').textContent = products.length;
        
        const brands = new Set(products.map(p => p.brand).filter(Boolean));
        document.getElementById('statBrand').textContent = brands.size;
        
        const categories = new Set(products.map(p => p.kategori).filter(Boolean));
        document.getElementById('statKategori').textContent = categories.size;
        
        const unggulan = products.filter(p => p.unggulan === 'YA').length;
        document.getElementById('statUnggulan').textContent = unggulan;
    }

    // ============================================
    // REFRESH
    // ============================================
    window.refreshProducts = function() {
        loadProducts();
    };

    // ============================================
    // TAMBAH PRODUK
    // ============================================
    window.tambahProduk = async function() {
        const statusEl = document.getElementById('tambahStatusMsg');
        
        const data = {
            brand: document.getElementById('tambahBrand').value.trim(),
            tipe: document.getElementById('tambahTipe').value.trim(),
            harga: Number(document.getElementById('tambahHarga').value) || 0,
            kategori: document.getElementById('tambahKategori').value.trim(),
            subKategori: document.getElementById('tambahSubKategori').value.trim(),
            spek1: document.getElementById('tambahSpek1').value.trim(),
            spek2: document.getElementById('tambahSpek2').value.trim(),
            spek3: document.getElementById('tambahSpek3').value.trim(),
            spek4: document.getElementById('tambahSpek4').value.trim(),
            spek5: document.getElementById('tambahSpek5').value.trim(),
            foto: document.getElementById('tambahFoto').value.trim(),
            status: document.getElementById('tambahStatus').value,
            unggulan: document.getElementById('tambahUnggulan').value,
            urutan: Number(document.getElementById('tambahUrutan').value) || 999,
            updated_at: new Date().toISOString()
        };

        // Validasi
        if (!data.brand || !data.tipe || !data.kategori) {
            statusEl.className = 'status-message error';
            statusEl.textContent = '⚠️ Brand, Tipe, dan Kategori wajib diisi!';
            return;
        }

        try {
            statusEl.className = 'status-message loading';
            statusEl.textContent = '⏳ Menyimpan...';

            const docId = `${data.brand}_${data.tipe}`.replace(/[\/\\#,+()$~%.'":*?<>{} ]/g, '_');
            await setDoc(doc(db, COLLECTIONS.PRODUCTS, docId), data);

            statusEl.className = 'status-message success';
            statusEl.textContent = '✅ Produk berhasil ditambahkan!';
            
            // Reset form
            document.getElementById('tambahForm').reset();
            
            // Reload
            loadProducts();
        } catch (error) {
            statusEl.className = 'status-message error';
            statusEl.textContent = `❌ Gagal: ${error.message}`;
        }
    };

    // ============================================
    // EDIT PRODUK
    // ============================================
    window.editProduk = function(id) {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;

        document.getElementById('editId').value = id;
        document.getElementById('editBrand').value = product.brand || '';
        document.getElementById('editTipe').value = product.tipe || '';
        document.getElementById('editHarga').value = product.harga || '';
        document.getElementById('editKategori').value = product.kategori || '';
        document.getElementById('editSubKategori').value = product.subKategori || '';
        document.getElementById('editSpek1').value = product.spek1 || '';
        document.getElementById('editSpek2').value = product.spek2 || '';
        document.getElementById('editSpek3').value = product.spek3 || '';
        document.getElementById('editSpek4').value = product.spek4 || '';
        document.getElementById('editSpek5').value = product.spek5 || '';
        document.getElementById('editFoto').value = product.foto || '';
        document.getElementById('editStatus').value = product.status || '';
        document.getElementById('editUnggulan').value = product.unggulan || '';
        document.getElementById('editUrutan').value = product.urutan || 999;

        document.getElementById('editModal').classList.add('show');
        document.getElementById('editStatusMsg').textContent = '';
    };

    // ============================================
    // UPDATE PRODUK
    // ============================================
    window.updateProduk = async function() {
        const id = document.getElementById('editId').value;
        const statusEl = document.getElementById('editStatusMsg');

        const data = {
            brand: document.getElementById('editBrand').value.trim(),
            tipe: document.getElementById('editTipe').value.trim(),
            harga: Number(document.getElementById('editHarga').value) || 0,
            kategori: document.getElementById('editKategori').value.trim(),
            subKategori: document.getElementById('editSubKategori').value.trim(),
            spek1: document.getElementById('editSpek1').value.trim(),
            spek2: document.getElementById('editSpek2').value.trim(),
            spek3: document.getElementById('editSpek3').value.trim(),
            spek4: document.getElementById('editSpek4').value.trim(),
            spek5: document.getElementById('editSpek5').value.trim(),
            foto: document.getElementById('editFoto').value.trim(),
            status: document.getElementById('editStatus').value,
            unggulan: document.getElementById('editUnggulan').value,
            urutan: Number(document.getElementById('editUrutan').value) || 999,
            updated_at: new Date().toISOString()
        };

        if (!data.brand || !data.tipe || !data.kategori) {
            statusEl.className = 'status-message error';
            statusEl.textContent = '⚠️ Brand, Tipe, dan Kategori wajib diisi!';
            return;
        }

        try {
            statusEl.className = 'status-message loading';
            statusEl.textContent = '⏳ Menyimpan...';

            await setDoc(doc(db, COLLECTIONS.PRODUCTS, id), data);

            statusEl.className = 'status-message success';
            statusEl.textContent = '✅ Produk berhasil diupdate!';
            
            setTimeout(() => {
                document.getElementById('editModal').classList.remove('show');
                loadProducts();
            }, 1000);
        } catch (error) {
            statusEl.className = 'status-message error';
            statusEl.textContent = `❌ Gagal: ${error.message}`;
        }
    };

    // ============================================
    // HAPUS PRODUK
    // ============================================
    window.hapusProduk = async function(id) {
        if (!confirm('Yakin ingin menghapus produk ini?')) return;
        
        try {
            await deleteDoc(doc(db, COLLECTIONS.PRODUCTS, id));
            loadProducts();
        } catch (error) {
            alert('Gagal menghapus: ' + error.message);
        }
    };

    // ============================================
    // UPLOAD EXCEL
    // ============================================
    window.uploadExcel = function() {
        const fileInput = document.getElementById('excelFile');
        const statusEl = document.getElementById('uploadStatus');

        if (!fileInput.files.length) {
            statusEl.className = 'status-message error';
            statusEl.textContent = '⚠️ Pilih file terlebih dahulu!';
            return;
        }

        const file = fileInput.files[0];
        statusEl.className = 'status-message loading';
        statusEl.textContent = '⏳ Memproses...';

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets['KATALOG'] || workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                let successCount = 0;

                for (let i = 0; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (!row || row.length < 2) continue;
                    
                    // Skip header
                    if (i === 0 && (String(row[0] || '').toUpperCase() === 'BRAND')) continue;
                    if (!row[0] || !row[1]) continue;

                    const product = {
                        brand: String(row[0] || '').trim(),
                        tipe: String(row[1] || '').trim(),
                        harga: Number(String(row[2] || '').replace(/[^0-9]/g, '')) || 0,
                        kategori: String(row[3] || '').trim(),
                        subKategori: String(row[4] || '').trim(),
                        spek1: String(row[5] || '').trim(),
                        spek2: String(row[6] || '').trim(),
                        spek3: String(row[7] || '').trim(),
                        spek4: String(row[8] || '').trim(),
                        spek5: String(row[9] || '').trim(),
                        foto: String(row[10] || '').trim(),
                        status: String(row[11] || '').trim().toUpperCase(),
                        unggulan: String(row[12] || '').trim().toUpperCase(),
                        urutan: Number(row[13]) || 999,
                        updated_at: new Date().toISOString()
                    };

                    const docId = `${product.brand}_${product.tipe}`.replace(/[\/\\#,+()$~%.'":*?<>{} ]/g, '_');
                    await setDoc(doc(db, COLLECTIONS.PRODUCTS, docId), product);
                    successCount++;
                }

                statusEl.className = 'status-message success';
                statusEl.textContent = `✅ ${successCount} produk berhasil diupload!`;
                fileInput.value = '';
                loadProducts();

            } catch (error) {
                statusEl.className = 'status-message error';
                statusEl.textContent = `❌ Gagal: ${error.message}`;
            }
        };
        reader.readAsArrayBuffer(file);
    };

    // ============================================
    // MIGRASI GOOGLE SHEETS
    // ============================================
    window.migrasiGoogleSheets = async function() {
        const url = document.getElementById('migrasiUrl').value.trim();
        const statusEl = document.getElementById('migrasiStatus');

        if (!url) {
            statusEl.className = 'status-message error';
            statusEl.textContent = '⚠️ Masukkan URL Google Sheets API!';
            return;
        }

        try {
            statusEl.className = 'status-message loading';
            statusEl.textContent = '⏳ Mengambil data dari Google Sheets...';

            const response = await fetch(url);
            const data = await response.json();

            if (!data.produk || data.produk.length === 0) {
                statusEl.className = 'status-message error';
                statusEl.textContent = '❌ Tidak ada data produk di Google Sheets!';
                return;
            }

            statusEl.textContent = `⏳ Menyimpan ${data.produk.length} produk ke Firebase...`;

            let successCount = 0;
            for (const p of data.produk) {
                const product = {
                    brand: p.brand || '',
                    tipe: p.tipe || '',
                    harga: Number(p.harga) || 0,
                    kategori: p.kategori || '',
                    subKategori: p.subKategori || '',
                    spek1: p.spek1 || '',
                    spek2: p.spek2 || '',
                    spek3: p.spek3 || '',
                    spek4: p.spek4 || '',
                    spek5: p.spek5 || '',
                    foto: p.foto || '',
                    status: (p.status || '').toUpperCase(),
                    unggulan: (p.unggulan || '').toUpperCase(),
                    urutan: Number(p.urutan) || 999,
                    updated_at: new Date().toISOString()
                };

                const docId = `${product.brand}_${product.tipe}`.replace(/[\/\\#,+()$~%.'":*?<>{} ]/g, '_');
                await setDoc(doc(db, COLLECTIONS.PRODUCTS, docId), product);
                successCount++;
            }

            statusEl.className = 'status-message success';
            statusEl.textContent = `✅ ${successCount} produk berhasil dimigrasi ke Firebase!`;
            loadProducts();

        } catch (error) {
            statusEl.className = 'status-message error';
            statusEl.textContent = `❌ Gagal: ${error.message}`;
        }
    };

    // ============================================
    // LOAD SETTINGS
    // ============================================
    window.loadSettings = async function() {
        try {
            const docRef = doc(db, COLLECTIONS.SETTINGS, 'settings');
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('settingJudul').value = data.judul_web || '';
                document.getElementById('settingSubJudul').value = data.subjudul || '';
                document.getElementById('settingWa').value = data.wa_admin || '';
                document.getElementById('settingTentang').value = data.tentang || '';
                document.getElementById('settingPromo').value = data.promo || '';
            }
        } catch (error) {
            console.error('Error loading settings:', error);
        }
    };

    // ============================================
    // SAVE SETTINGS
    // ============================================
    window.saveSettings = async function() {
        const statusEl = document.getElementById('settingStatus');
        
        const data = {
            judul_web: document.getElementById('settingJudul').value.trim(),
            subjudul: document.getElementById('settingSubJudul').value.trim(),
            wa_admin: document.getElementById('settingWa').value.trim(),
            tentang: document.getElementById('settingTentang').value.trim(),
            promo: document.getElementById('settingPromo').value.trim(),
            updated_at: new Date().toISOString()
        };

        try {
            statusEl.className = 'status-message loading';
            statusEl.textContent = '⏳ Menyimpan...';

            await setDoc(doc(db, COLLECTIONS.SETTINGS, 'settings'), data);

            statusEl.className = 'status-message success';
            statusEl.textContent = '✅ Pengaturan berhasil disimpan!';
        } catch (error) {
            statusEl.className = 'status-message error';
            statusEl.textContent = `❌ Gagal: ${error.message}`;
        }
    };

    // ============================================
    // EXPOSE FUNCTIONS KE GLOBAL WINDOW
    // ============================================
    window.loadProducts = loadProducts;
    window.loadSettings = window.loadSettings;

    // ============================================
    // INIT
    // ============================================
    console.log('🔥 Admin panel siap!');
</script>
